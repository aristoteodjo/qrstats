services:
  db:
    image: postgres:17
    container_name: qrstats-db
    environment:
      POSTGRES_USER: qrstats
      POSTGRES_PASSWORD: qrstats
      POSTGRES_DB: qrstats
    ports:
      - "5470:5432"
    volumes:
      - qrstats-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrstats"]
      interval: 5s
      retries: 10

volumes:
  qrstats-db:
